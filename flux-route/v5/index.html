<script>
"use strict";
/* FLUX ROUTE v0.3 — all GLSL sources.
 * Units: field velocity = sim texels/sec; actor velocity = UV/sec; SDF = sim
 * texels; positions = UV. Conversions marked (!!).
 * DYE CHEMISTRY: R = cargo (the only scored species, fixed level emitters),
 * B = builder (R+B precipitates gel), G = reagent (R+G reacts exothermically:
 * consumes both, repulsive force ~ grad(R*G)). B+G: inert, reserved (TODO).
 * Zones (regions tex): r=sink g=drain b=trigger a=sensor.
 * Actors: 0 empty, 1 player, 2 fan, 3 emitter, 5 piston, 6 predator, 7 nest.
 * Obstacle field (composed per substep): rg=boundary vel (texels/s),
 * b=solid flag, a=porous gel drag.
 */
const GLSL = (function () {

const VS_FULLSCREEN = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPosition;
out vec2 vUv;
void main(){ vUv = aPosition*0.5+0.5; gl_Position = vec4(aPosition,0.0,1.0); }
`;

const FRAG_HEADER = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
`;

/* solidAt against the composed obstacle field: ONE fetch (plan §19) */
const OBST = `uniform sampler2D uObstacle;
struct Solid { bool isSolid; vec2 vel; };
Solid solidAt(vec2 uv){
  Solid s; s.isSolid=false; s.vel=vec2(0.0);
  if(uv.x<=0.0||uv.x>=1.0||uv.y<=0.0||uv.y>=1.0){ s.isSolid=true; return s; }
  vec4 o = texture(uObstacle,uv);
  s.isSolid = o.b>0.5; s.vel = o.rg;
  return s;
}
`;

/* shared zone-removal math: dyePost and scoreAccum MUST agree exactly */
const ZONES = `uniform sampler2D uRegions;
uniform float uAbsorbRate;
uniform float uDrainRate;
uniform float uDt;
vec3 zoneRemoval(vec3 dye, vec2 uv, out float wSink, out float wTrig){
  vec3 z = texture(uRegions, uv).rgb;
  vec3 rates = vec3(uAbsorbRate*z.r, uDrainRate*z.g, uAbsorbRate*z.b);
  float R = rates.x + rates.y + rates.z;
  wSink = R>1e-6 ? rates.x/R : 0.0;
  wTrig = R>1e-6 ? rates.z/R : 0.0;
  return dye*(1.0 - exp(-R*uDt));
}
`;

/* species (texture channels) -> display colors. Chemistry lives in pure
 * channel space; aesthetics live here and ONLY here. */
const SPECIES = `const vec3 SPEC_R = vec3(1.00,0.22,0.06);
const vec3 SPEC_G = vec3(0.10,1.00,0.20);
const vec3 SPEC_B = vec3(0.10,0.25,1.00);
vec3 speciesToDisplay(vec3 s){ return s.r*SPEC_R + s.g*SPEC_G + s.b*SPEC_B; }
`;

const copyFS = FRAG_HEADER + `uniform sampler2D uSrc;
uniform float uMul;
void main(){ fragColor = texture(uSrc,vUv)*uMul; }
`;

const advectFS = FRAG_HEADER + `uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform sampler2D uMedia;      /* r=curl mul, g=velDiss mul, b=dyeDiss mul */
uniform float uMediaChan;      /* 0=none 1=g 2=b */
uniform vec2  uSimTexel;
uniform float uDt;
uniform float uDissipation;
void main(){
  vec2 vel = texture(uVelocity,vUv).xy;
  vec2 coord = vUv - uDt*vel*uSimTexel;
  vec4 m = texture(uMedia,vUv);
  float mul = uMediaChan<0.5 ? 1.0 : (uMediaChan<1.5 ? m.g : m.b);
  fragColor = texture(uSource,coord) * exp(-uDissipation*mul*uDt);
}
`;

const curlFS = FRAG_HEADER + `uniform sampler2D uVelocity;
uniform vec2 uSimTexel;
void main(){
  float L = texture(uVelocity, vUv-vec2(uSimTexel.x,0.0)).y;
  float R = texture(uVelocity, vUv+vec2(uSimTexel.x,0.0)).y;
  float B = texture(uVelocity, vUv-vec2(0.0,uSimTexel.y)).x;
  float T = texture(uVelocity, vUv+vec2(0.0,uSimTexel.y)).x;
  fragColor = vec4(R-L-T+B, 0.0, 0.0, 1.0);
}
`;

const vorticityFS = FRAG_HEADER + `uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform sampler2D uMedia;
uniform vec2  uSimTexel;
uniform float uCurlStrength;
uniform float uDt;
void main(){
  float L = texture(uCurl, vUv-vec2(uSimTexel.x,0.0)).x;
  float R = texture(uCurl, vUv+vec2(uSimTexel.x,0.0)).x;
  float B = texture(uCurl, vUv-vec2(0.0,uSimTexel.y)).x;
  float T = texture(uCurl, vUv+vec2(0.0,uSimTexel.y)).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = 0.5*vec2(abs(T)-abs(B), abs(R)-abs(L));
  force /= length(force)+1e-4;
  force *= uCurlStrength * texture(uMedia,vUv).r * C;
  force.y *= -1.0;
  vec2 vel = texture(uVelocity,vUv).xy + force*uDt;
  fragColor = vec4(clamp(vel, vec2(-1000.0), vec2(1000.0)), 0.0, 1.0);
}
`;

/* exothermic R+G repulsion + dye-driven amp jets (red-powered) */
const reactForceFS = FRAG_HEADER + `uniform sampler2D uVelocity;
uniform sampler2D uDye;
uniform sampler2D uAmp;        /* rg = jet dir*gain, texels/s^2 per unit red */
uniform vec2  uSimTexel;
uniform float uExoForce;
uniform float uDt;
float exoAt(vec2 uv){ vec4 d = texture(uDye,uv); return d.r*d.g; }
void main(){
  vec2 vel = texture(uVelocity,vUv).xy;
  float eR = exoAt(vUv+vec2(uSimTexel.x,0.0));
  float eL = exoAt(vUv-vec2(uSimTexel.x,0.0));
  float eT = exoAt(vUv+vec2(0.0,uSimTexel.y));
  float eB = exoAt(vUv-vec2(0.0,uSimTexel.y));
  vec2 grad = 0.5*vec2(eR-eL, eT-eB);
  vel += -grad*uExoForce*uDt;                       /* blast away from reaction */
  float red = texture(uDye,vUv).r;
  vel += texture(uAmp,vUv).rg * min(red,4.0) * uDt; /* red powers the machines */
  fragColor = vec4(clamp(vel,vec2(-1000.0),vec2(1000.0)), 0.0, 1.0);
}
`;

const divergenceFS = FRAG_HEADER + OBST + `uniform sampler2D uVelocity;
uniform vec2 uSimTexel;
void main(){
  vec2 uvL=vUv-vec2(uSimTexel.x,0.0), uvR=vUv+vec2(uSimTexel.x,0.0);
  vec2 uvB=vUv-vec2(0.0,uSimTexel.y), uvT=vUv+vec2(0.0,uSimTexel.y);
  vec2 vL=texture(uVelocity,uvL).xy;
  vec2 vR=texture(uVelocity,uvR).xy;
  vec2 vB=texture(uVelocity,uvB).xy;
  vec2 vT=texture(uVelocity,uvT).xy;
  Solid sL=solidAt(uvL); if(sL.isSolid) vL=sL.vel;
  Solid sR=solidAt(uvR); if(sR.isSolid) vR=sR.vel;
  Solid sB=solidAt(uvB); if(sB.isSolid) vB=sB.vel;
  Solid sT=solidAt(uvT); if(sT.isSolid) vT=sT.vel;
  fragColor = vec4(0.5*((vR.x-vL.x)+(vT.y-vB.y)), 0.0, 0.0, 1.0);
}
`;

const jacobiFS = FRAG_HEADER + OBST + `uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform vec2 uSimTexel;
void main(){
  vec2 uvL=vUv-vec2(uSimTexel.x,0.0), uvR=vUv+vec2(uSimTexel.x,0.0);
  vec2 uvB=vUv-vec2(0.0,uSimTexel.y), uvT=vUv+vec2(0.0,uSimTexel.y);
  float pC = texture(uPressure,vUv).x;
  float pL = solidAt(uvL).isSolid ? pC : texture(uPressure,uvL).x;
  float pR = solidAt(uvR).isSolid ? pC : texture(uPressure,uvR).x;
  float pB = solidAt(uvB).isSolid ? pC : texture(uPressure,uvB).x;
  float pT = solidAt(uvT).isSolid ? pC : texture(uPressure,uvT).x;
  float div = texture(uDivergence,vUv).x;
  fragColor = vec4((pL+pR+pB+pT-div)*0.25, 0.0, 0.0, 1.0);
}
`;

const gradientSubtractFS = FRAG_HEADER + OBST + `uniform sampler2D uPressure;
uniform sampler2D uVelocity;
uniform vec2 uSimTexel;
uniform float uGelDrag;
uniform float uDt;
void main(){
  Solid sC = solidAt(vUv);
  if(sC.isSolid){ fragColor = vec4(sC.vel, 0.0, 1.0); return; }
  vec2 uvL=vUv-vec2(uSimTexel.x,0.0), uvR=vUv+vec2(uSimTexel.x,0.0);
  vec2 uvB=vUv-vec2(0.0,uSimTexel.y), uvT=vUv+vec2(0.0,uSimTexel.y);
  float pC = texture(uPressure,vUv).x;
  float pL = solidAt(uvL).isSolid ? pC : texture(uPressure,uvL).x;
  float pR = solidAt(uvR).isSolid ? pC : texture(uPressure,uvR).x;
  float pB = solidAt(uvB).isSolid ? pC : texture(uPressure,uvB).x;
  float pT = solidAt(uvT).isSolid ? pC : texture(uPressure,uvT).x;
  vec2 vel = texture(uVelocity,vUv).xy - 0.5*vec2(pR-pL, pT-pB);
  vel *= exp(-uGelDrag*texture(uObstacle,vUv).a*uDt);   /* porous gel */
  fragColor = vec4(vel, 0.0, 1.0);
}
`;

const gelUpdateFS = FRAG_HEADER + `uniform sampler2D uGel;
uniform sampler2D uDye;
uniform sampler2D uVelocity;
uniform float uGelReact;
uniform float uGelDissolve;
uniform float uGelErode;
uniform float uDt;
void main(){
  float gel = texture(uGel,vUv).r;
  vec3  d   = texture(uDye,vUv).rgb;
  float spd = length(texture(uVelocity,vUv).xy);
  gel += uGelReact*d.r*d.b*uDt;                 /* R + B precipitate */
  gel -= gel*(uGelDissolve + uGelErode*spd)*uDt;
  fragColor = vec4(clamp(gel,0.0,2.0), 0.0, 0.0, 1.0);
}
`;

const obstacleComposeFS = FRAG_HEADER + `uniform sampler2D uLevel;
uniform sampler2D uDynMask;
uniform sampler2D uGel;
uniform float uGelSolid;
void main(){
  vec2 vel = vec2(0.0); float solid = 0.0;
  if(texture(uLevel,vUv).r <= 0.0) solid = 1.0;
  vec4 m = texture(uDynMask,vUv);
  if(m.a > 0.5){ solid = 1.0; vel = m.rg/max(m.a,1e-4); }
  float gel = texture(uGel,vUv).r;
  if(gel >= uGelSolid){ solid = 1.0; vel = vec2(0.0); }
  float drag = clamp(gel/max(uGelSolid,1e-3), 0.0, 1.0)*(1.0-solid);
  fragColor = vec4(vel, solid, drag);
}
`;

const dyePostFS = FRAG_HEADER + OBST + ZONES + `uniform sampler2D uDye;
uniform float uSolidDecay;
uniform float uExoConsume;
uniform float uGelConsume;
void main(){
  vec4 dye = texture(uDye,vUv);
  float wS, wT;
  dye.rgb -= zoneRemoval(dye.rgb, vUv, wS, wT);
  float rxExo = dye.r*dye.g;
  float rxGel = dye.r*dye.b;
  dye.r -= (uExoConsume*rxExo + uGelConsume*rxGel)*uDt;
  dye.g -= uExoConsume*rxExo*uDt;
  dye.b -= uGelConsume*rxGel*uDt;
  if(solidAt(vUv).isSolid) dye.rgb *= exp(-uSolidDecay*uDt);
  dye.rgb = max(dye.rgb, vec3(0.0));        /* required: predators splat negative */
  fragColor = dye;
}
`;

/* only RED is scored: delivery and trigger banking count dye.r alone */
const scoreAccumFS = FRAG_HEADER + ZONES + `uniform sampler2D uScoreAcc;
uniform sampler2D uDye;
uniform float uActive;
void main(){
  vec4 acc = texture(uScoreAcc,vUv);
  float wS, wT;
  vec3 removed = zoneRemoval(texture(uDye,vUv).rgb, vUv, wS, wT);
  acc.r += removed.r*wS*uActive;
  acc.a += removed.r*wT*uActive;
  fragColor = acc;
}
`;

const sensorFS = FRAG_HEADER + `uniform sampler2D uDye;
uniform sampler2D uVelocity;
uniform sampler2D uRegions;
void main(){
  float sensor = texture(uRegions,vUv).a;
  float red = texture(uDye,vUv).r;
  float spd = length(texture(uVelocity,vUv).xy);
  fragColor = vec4(sensor*red*spd, 0.0, 0.0, 1.0);
}
`;

const reduceFS = FRAG_HEADER + `uniform sampler2D uSrc;
uniform ivec2 uSrcSize;
void main(){
  ivec2 base = ivec2(gl_FragCoord.xy)*2;
  vec4 s = vec4(0.0);
  for(int dy=0;dy<2;dy++)
  for(int dx=0;dx<2;dx++){
    ivec2 c = base+ivec2(dx,dy);
    if(c.x<uSrcSize.x && c.y<uSrcSize.y) s += texelFetch(uSrc,c,0);
  }
  fragColor = s;
}
`;

const telemetryFS = FRAG_HEADER + `uniform sampler2D uScoreOne;
uniform sampler2D uSensorReduced;
uniform sampler2D uActors;
void main(){
  int x = int(gl_FragCoord.x);
  if(x==0)      fragColor = texelFetch(uScoreOne, ivec2(0,0), 0);
  else if(x==1) fragColor = vec4(texelFetch(uSensorReduced, ivec2(0,0), 0).r, 0.0, 0.0, 0.0);
  else          fragColor = texelFetch(uActors, ivec2(x-2,0), 0);
}
`;

const jfaSeedFS = FRAG_HEADER + `uniform sampler2D uLevelPng;
uniform float uInvert;
void main(){
  float solid = step(0.5, texture(uLevelPng,vUv).r);
  float isSeed = mix(solid, 1.0-solid, uInvert);
  fragColor = isSeed>0.5 ? vec4(vUv,1.0,1.0) : vec4(-1.0,-1.0,0.0,1.0);
}
`;

const jfaStepFS = FRAG_HEADER + `uniform sampler2D uSeeds;
uniform vec2 uSimTexel;
uniform vec2 uSimSize;
uniform float uStep;
void main(){
  vec4 best = texture(uSeeds,vUv);
  float bestD = best.z>0.5 ? length((vUv-best.xy)*uSimSize) : 1e8;
  for(int dy=-1;dy<=1;dy++)
  for(int dx=-1;dx<=1;dx++){
    vec2 nUv = clamp(vUv+vec2(float(dx),float(dy))*uStep*uSimTexel, vec2(0.0), vec2(1.0));
    vec4 cand = texture(uSeeds,nUv);
    if(cand.z>0.5){
      float d = length((vUv-cand.xy)*uSimSize);
      if(d<bestD){ bestD=d; best=cand; }
    }
  }
  fragColor = best;
}
`;

const jfaCombineFS = FRAG_HEADER + `uniform sampler2D uLevelPng;
uniform sampler2D uSolidSeeds;
uniform sampler2D uEmptySeeds;
uniform vec2 uSimSize;
void main(){
  float solid = step(0.5, texture(uLevelPng,vUv).r);
  vec4 ss = texture(uSolidSeeds,vUv);
  vec4 es = texture(uEmptySeeds,vUv);
  float dOut = ss.z>0.5 ? length((vUv-ss.xy)*uSimSize) : 1e4;
  float dIn  = es.z>0.5 ? length((vUv-es.xy)*uSimSize) : 1e4;
  fragColor = vec4(mix(dOut,-dIn,solid), 0.0, 0.0, 1.0);
}
`;

const jfaGradFS = FRAG_HEADER + `uniform sampler2D uDist;
uniform vec2 uSimTexel;
void main(){
  float dC = texture(uDist,vUv).r;
  float dL = texture(uDist,vUv-vec2(uSimTexel.x,0.0)).r;
  float dR = texture(uDist,vUv+vec2(uSimTexel.x,0.0)).r;
  float dB = texture(uDist,vUv-vec2(0.0,uSimTexel.y)).r;
  float dT = texture(uDist,vUv+vec2(0.0,uSimTexel.y)).r;
  vec2 g = vec2(dR-dL, dT-dB);
  float len = length(g);
  g = len<1e-5 ? vec2(0.0,1.0) : g/len;
  fragColor = vec4(dC, g, 0.0);
}
`;

const actorUpdateFS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform sampler2D uActors;
uniform sampler2D uVelocity;
uniform sampler2D uLevel;
uniform sampler2D uDye;
uniform vec2  uSimTexel;
uniform float uDt;
uniform float uTime;
uniform vec4  uInput;          /* xy = thrust dir, z = spin input -1/0/1 */
uniform float uThrust;
uniform float uDragK;
uniform float uLinDamp;
uniform float uSpinAccel;
uniform float uSpinDamp;
uniform float uSpinKick;
uniform float uEntityScale;
uniform float uMassPlayer;
uniform float uMassPred;
uniform float uMassPiston;
uniform float uRestitution;
uniform float uPistonSpring;
uniform float uPistonDamp;
uniform vec4  uSpawn;
uniform vec4  uSpawnParams;
uniform vec4  uSpawnDye;
void resolveWalls(inout vec2 pos, inout vec2 vel, float radius){
  vec4 lv = texture(uLevel,pos);
  float pen = lv.r - radius;
  if(pen<0.0){
    vec2 n = lv.gb;
    pos += -pen*n*uSimTexel;
    vec2 vT = vel/uSimTexel;
    float vn = dot(vT,n);
    if(vn<0.0) vT -= vn*n;
    vel = vT*uSimTexel;
  }
  vec2 rUv = vec2(radius)*uSimTexel;
  pos = clamp(pos, rUv, vec2(1.0)-rUv);
}
float massOf(int t){
  if(t==1) return uMassPlayer;
  if(t==5) return uMassPiston;
  if(t==6) return uMassPred;
  return 1e5;                       /* fans/emitters: immovable */
}
/* symmetric body collisions: every dynamic actor resolves against the same
 * pre-update table, so both parties compute identical contacts and impulses */
void collideBodies(int slot, inout vec2 pos, inout vec2 vel, float radius, float mass){
  for(int o=0;o<64;o++){
    if(o==slot) continue;
    vec4 or1 = texelFetch(uActors, ivec2(o,1), 0);
    int ot = int(or1.x);
    if(ot!=1 && ot!=2 && ot!=3 && ot!=5 && ot!=6) continue;
    vec4 or0 = texelFetch(uActors, ivec2(o,0), 0);
    vec2 dT = (pos-or0.xy)/uSimTexel;
    float rr = radius + or1.y*uEntityScale;
    float dist = length(dT);
    if(dist>=rr || dist<1e-4) continue;
    vec2 nn = dT/dist;
    float mO = massOf(ot);
    pos += nn*(rr-dist)*(mO/(mass+mO))*uSimTexel;
    vec2 vT = vel/uSimTexel;
    vec2 ovT = or0.zw/uSimTexel;
    float rel = dot(vT-ovT, nn);
    if(rel<0.0){
      float j = -(1.0+uRestitution)*rel/(1.0/mass+1.0/mO);
      vT += (j/mass)*nn;
    }
    vel = vT*uSimTexel;
  }
}
void main(){
  int slot = int(gl_FragCoord.x);
  int row  = int(gl_FragCoord.y);
  vec4 r0 = texelFetch(uActors, ivec2(slot,0), 0);
  vec4 r1 = texelFetch(uActors, ivec2(slot,1), 0);
  vec4 r2 = texelFetch(uActors, ivec2(slot,2), 0);
  vec4 r3 = texelFetch(uActors, ivec2(slot,3), 0);
  int type = int(r1.x);

  if(uSpawn.x>=0.0 && slot==int(uSpawn.x)){
    vec4 player = texelFetch(uActors, ivec2(0,0), 0);
    r0 = vec4(player.xy + uSpawn.zw, 0.0, 0.0);
    r1 = vec4(uSpawn.y, uSpawnParams.xyz);
    r2 = vec4(uSpawnParams.w, 0.0, uSpawnDye.x, uSpawnDye.y);
    r3 = vec4(uSpawnDye.z, 0.0, 0.0, 0.0);
    type = int(uSpawn.y);
  }

  if(type==5){    /* spring piston: a body chasing its oscillating target */
    vec2 axis = vec2(cos(r1.w), sin(r1.w));
    vec2 target = r3.yz + axis*r1.z*sin(uTime*r2.z + r2.w);
    vec2 pos = r0.xy, vel = r0.zw;
    vel += uPistonSpring*(target-pos)*uDt;
    vel *= exp(-uPistonDamp*uDt);
    collideBodies(slot, pos, vel, r1.y*uEntityScale, uMassPiston);
    pos += vel*uDt;
    resolveWalls(pos, vel, r1.y*uEntityScale);
    r0 = vec4(pos,vel);
  }

  if(type==6){    /* predator: swims up the red-dye gradient, winds down */
    vec2 pos = r0.xy, vel = r0.zw;
    float life = clamp(r2.x / max(r3.w,1e-3), 0.0, 1.0);
    vec2 h = 2.0*uSimTexel;
    float dR = texture(uDye,pos+vec2(h.x,0.0)).r;
    float dL = texture(uDye,pos-vec2(h.x,0.0)).r;
    float dT = texture(uDye,pos+vec2(0.0,h.y)).r;
    float dB = texture(uDye,pos-vec2(0.0,h.y)).r;
    vec2 g = vec2(dR-dL, dT-dB);
    r2.w += 0.9*uDt;
    vec2 dir = length(g)>2e-3 ? normalize(g) : vec2(cos(r2.w), sin(r2.w));
    vec2 fluidUv = texture(uVelocity,pos).xy*uSimTexel;
    vel += (dir*r1.z*life + uDragK*(fluidUv-vel))*uDt;
    vel *= exp(-uLinDamp*uDt);
    collideBodies(slot, pos, vel, r1.y*uEntityScale, uMassPred);
    pos += vel*uDt;
    resolveWalls(pos, vel, r1.y*uEntityScale);
    r0 = vec4(pos,vel);
  }

  if(type==1){    /* player */
    vec2 pos = r0.xy, vel = r0.zw;
    r2.z += uInput.z*uSpinAccel*uDt;                /* spin omega */
    r2.z *= exp(-uSpinDamp*uDt);
    r2.w += r2.z*uDt;                               /* spin angle, for the glyph */
    vec2 fluidUv = texture(uVelocity,pos).xy * uSimTexel;     /* (!!) */
    vel += (uInput.xy*uThrust + uDragK*(fluidUv-vel)) * uDt;
    vel *= exp(-uLinDamp*uDt);
    pos += vel*uDt;
    resolveWalls(pos, vel, r1.y*uEntityScale);
    for(int o=1;o<64;o++){
      vec4 or1 = texelFetch(uActors, ivec2(o,1), 0);
      int ot = int(or1.x);
      if(ot!=2 && ot!=3 && ot!=5 && ot!=6) continue;
      vec4 or0 = texelFetch(uActors, ivec2(o,0), 0);
      vec2 dT2 = (pos-or0.xy)/uSimTexel;
      float rr = (r1.y + or1.y)*uEntityScale;
      float dist = length(dT2);
      if(dist<rr && dist>1e-4){
        vec2 nn = dT2/dist;
        float mO = massOf(ot);
        pos += nn*(rr-dist)*(mO/(uMassPlayer+mO))*uSimTexel;
        vec2 vT = vel/uSimTexel;
        vec2 ovT = or0.zw/uSimTexel;
        float rel = dot(vT-ovT, nn);
        if(rel<0.0){
          float j = -(1.0+uRestitution)*rel/(1.0/uMassPlayer+1.0/mO);
          vT += (j/uMassPlayer)*nn;
          vT += uSpinKick*r2.z*rr*vec2(-nn.y,nn.x); /* spin-biased deflection */
          r2.z *= 0.8;
        }
        vel = vT*uSimTexel;
      }
    }
    vec2 rUv = vec2(r1.y*uEntityScale)*uSimTexel;
    pos = clamp(pos, rUv, vec2(1.0)-rUv);
    r0 = vec4(pos,vel);
  }

  if(type!=0 && r2.x>=0.0){
    r2.x -= uDt;
    if(r2.x<=0.0){ r1.x = 0.0; }
  }
  fragColor = (row==0)?r0 : (row==1)?r1 : (row==2)?r2 : r3;
}
`;

const splatVS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aCorner;
uniform sampler2D uActors;
uniform int   uTarget;
uniform vec2  uSimTexel;
uniform float uExtentMul;
uniform float uEntityScale;
flat out vec4 vR0; flat out vec4 vR1; flat out vec4 vR2; flat out vec4 vR3;
out vec2 vLocal;
bool writesTarget(int type,int target){
  if(target==0) return type==2 || type==3 || type==6;  /* predators suck */
  if(target==1) return type==3 || type==6;            /* predators eat (negative) */
  if(target==2) return type==1 || type==5 || type==6; /* boundaries */
  return false;
}
void main(){
  int slot = gl_InstanceID;
  vR0 = texelFetch(uActors, ivec2(slot,0), 0);
  vR1 = texelFetch(uActors, ivec2(slot,1), 0);
  vR2 = texelFetch(uActors, ivec2(slot,2), 0);
  vR3 = texelFetch(uActors, ivec2(slot,3), 0);
  vLocal = aCorner;
  if(!writesTarget(int(vR1.x), uTarget)){ gl_Position = vec4(-2.0,-2.0,0.0,1.0); return; }
  vec2 extent = vR1.y*uEntityScale*uExtentMul*uSimTexel;
  gl_Position = vec4((vR0.xy + aCorner*extent)*2.0-1.0, 0.0, 1.0);
}
`;

const SPLAT_FRAG_IN = `#version 300 es
precision highp float;
in vec2 vLocal;
flat in vec4 vR0; flat in vec4 vR1; flat in vec4 vR2; flat in vec4 vR3;
out vec4 fragColor;
`;

const splatForceFS = SPLAT_FRAG_IN + `uniform float uDt;
uniform float uPredSuck;
uniform float uResScale;       /* SIM_H / 270: tunables are defined at the reference grid */
void main(){
  float g = exp(-dot(vLocal,vLocal)*4.5);
  int t = int(vR1.x);
  if(t==6){                       /* roving velocity sink: pull flow inward */
    float life = clamp(vR2.x/max(vR3.w,1e-3), 0.0, 1.0);
    float l = length(vLocal);
    vec2 toC = l>1e-3 ? -vLocal/l : vec2(0.0);
    fragColor = vec4(toC*uPredSuck*uResScale*life*g*uDt, 0.0, 0.0);
  } else {
    vec2 dir = vec2(cos(vR1.w), sin(vR1.w));
    fragColor = vec4(dir*vR1.z*uResScale*g*uDt, 0.0, 0.0);
  }
}
`;

const splatDyeFS = SPLAT_FRAG_IN + `uniform float uDt;
uniform float uEmitScale;
uniform float uEatRate;
void main(){
  float g = exp(-dot(vLocal,vLocal)*4.5);
  int t = int(vR1.x);
  if(t==6){
    float life = clamp(vR2.x/max(vR3.w,1e-3), 0.0, 1.0);
    fragColor = vec4(vec3(-uEatRate*g*uDt*life), 0.0);
  } else {
    fragColor = vec4(vec3(vR2.z,vR2.w,vR3.x)*vR1.z*uEmitScale*g*uDt, 0.0);
  }
}
`;

const splatMaskFS = SPLAT_FRAG_IN + `uniform vec2 uSimTexel;
uniform float uEntityScale;
void main(){
  float rTex = vR1.y*uEntityScale;
  float dTex = length(vLocal)*rTex*1.1;
  float cov = 1.0 - smoothstep(rTex-1.0, rTex, dTex);
  vec2 velTexels = vR0.zw/uSimTexel;                          /* (!!) per axis */
  float spin = (int(vR1.x)==1) ? vR2.z : 0.0;                 /* player only */
  vec2 tang = length(vLocal)>1e-3 ? vec2(-vLocal.y,vLocal.x)/length(vLocal) : vec2(0.0);
  vec2 spinTex = tang * spin * dTex;        /* rim velocity: Magnus emerges in the solve */
  fragColor = vec4((velTexels+spinTex)*cov, 0.0, cov);
}
`;

const ghostVS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aCorner;
uniform vec2  uGhostPos;
uniform float uGhostRadius;
uniform float uGhostAngle;
uniform float uGhostType;
uniform vec4  uGhostDye;
uniform vec2  uSimTexel;
uniform float uExtentMul;

flat out vec4 vR0; flat out vec4 vR1; flat out vec4 vR2; flat out vec4 vR3;
flat out float vSlot;
out vec2 vLocal;
void main(){
  vR0 = vec4(uGhostPos, 0.0, 0.0);
  vR1 = vec4(uGhostType, uGhostRadius, 0.0, uGhostAngle);
  vR2 = vec4(-1.0, 0.0, uGhostDye.x, uGhostDye.y);
  vR3 = vec4(uGhostDye.z, 0.0, 0.0, 0.0);
  vSlot = -1.0;
  vLocal = aCorner;
  vec2 extent = uGhostRadius*uEntityScale*uExtentMul*uSimTexel;

const glyphFS = SPLAT_FRAG_IN + SPECIES + `flat in float vSlot;
uniform float uGhost;
uniform float uGhostValid;
uniform int   uSelected;
vec2 rot(vec2 p, float a){ float c=cos(a), s=sin(a); return vec2(c*p.x+s*p.y, -s*p.x+c*p.y); }
void main(){
  int type = int(vR1.x);
  float len = length(vLocal);
  vec4 col = vec4(0.0);
  if(type==1){
    float fill = 1.0-smoothstep(0.52,0.58,len);
    float ring = smoothstep(0.46,0.52,len)*(1.0-smoothstep(0.58,0.64,len));
    vec2 p = rot(vLocal, vR2.w);                    /* spin angle */
    float a = atan(p.y,p.x);
    float ticks = step(0.7,abs(sin(a*1.5)))*step(0.30,len)*(1.0-smoothstep(0.46,0.52,len));
    vec3 c = mix(vec3(0.92,0.95,1.0), vec3(1.0,0.85,0.4), ticks);
    col = vec4(c, max(fill*0.25+ring*0.9, ticks*(0.5+0.4*min(abs(vR2.z)*0.15,1.0))));
  } else if(type==2){
    float ring = smoothstep(0.40,0.46,len)*(1.0-smoothstep(0.52,0.58,len));
    vec2 p = rot(vLocal, vR1.w);
    float shaft = (p.x>-0.05 && p.x<0.30 && abs(p.y)<0.07) ? 1.0 : 0.0;
    float head  = (p.x>=0.25 && p.x<0.52 && abs(p.y)<(0.52-p.x)*0.7) ? 1.0 : 0.0;
    float locked = mod(floor(vR2.y), 2.0);
    vec3 c = mix(vec3(0.45,0.95,1.0), vec3(0.55,0.60,0.70), locked);
    col = vec4(c, max(ring*0.9, max(shaft,head)*0.95));
  } else if(type==3){
    float fill = 1.0-smoothstep(0.30,0.36,len);
    float ring = smoothstep(0.42,0.48,len)*(1.0-smoothstep(0.52,0.58,len));
    vec2 p = rot(vLocal, vR1.w);
    float spout = (p.x>0.3 && p.x<0.62 && abs(p.y)<0.10) ? 1.0 : 0.0;
    vec3 dye = vec3(vR2.z,vR2.w,vR3.x);
    vec3 c = normalize(speciesToDisplay(max(dye,vec3(0.0)))+vec3(1e-4))*1.15;
    col = vec4(c, max(max(fill*0.9, ring*0.7), spout*0.85));
  } else if(type==5){
    float fill = 1.0-smoothstep(0.52,0.58,len);
    float ring = smoothstep(0.58,0.62,len)*(1.0-smoothstep(0.66,0.72,len));
    col = vec4(mix(vec3(0.22,0.24,0.30), vec3(1.0,0.72,0.25), ring),
               max(fill*0.9, ring*0.85));
  } else if(type==6){
    float life = clamp(vR2.x/max(vR3.w,1e-3), 0.0, 1.0);
    vec2 p = rot(vLocal, vR2.w*2.5);
    float a = atan(p.y,p.x);
    float blades = smoothstep(0.2,0.6,sin(a*3.0))*(1.0-smoothstep(0.30,0.55,len))*step(0.10,len);
    float ring = smoothstep(0.50,0.56,len)*(1.0-smoothstep(0.60,0.66,len));
    vec3 c = mix(vec3(0.55,0.20,0.75), vec3(1.0,0.40,0.50), life);
    col = vec4(c, max(blades*0.9, ring*0.8)*(0.35+0.65*life));
  } else if(type==7){
    float fr = clamp(vR2.w, 0.0, 1.0);
    float rad = 0.22 + 0.34*fr;
    float iris = smoothstep(rad,rad+0.05,len)*(1.0-smoothstep(rad+0.10,rad+0.16,len));
    float outer = smoothstep(0.60,0.66,len)*(1.0-smoothstep(0.70,0.76,len));
    col = vec4(vec3(0.85,0.35,0.90), max(iris*0.85, outer*0.6));
  } else if(type==8){
    vec2 p = rot(vLocal, 0.7854);
    float dm = abs(p.x)+abs(p.y);
    float core = 1.0-smoothstep(0.24,0.32,dm);
    float ring = smoothstep(0.52,0.58,len)*(1.0-smoothstep(0.64,0.70,len));
    vec3 c = normalize(speciesToDisplay(max(vec3(vR2.z,vR2.w,vR3.x),vec3(0.0)))+vec3(1e-4))*1.25;
    col = vec4(c, max(core*0.95, ring*0.55));
  }
  if(uGhost>0.5){
    col.rgb = mix(vec3(1.0,0.35,0.30), col.rgb*0.6+vec3(0.2,0.5,0.25), uGhostValid);
    col.a *= 0.55;
  } else if(uSelected>0 && int(vSlot)==uSelected){
    col.rgb = col.rgb*1.4 + vec3(0.15);
    col.a = min(col.a*1.25 + 0.12*(1.0-smoothstep(0.85,1.0,len)), 1.0);
  }
  fragColor = col;
}
`;

const brightFS = FRAG_HEADER + SPECIES + `uniform sampler2D uDye;
uniform float uThreshold;
uniform vec3  uBloomW;        /* per-species: red blooms like an ember */
void main(){
  vec3 c = max(texture(uDye,vUv).rgb*uBloomW - vec3(uThreshold), vec3(0.0));
  fragColor = vec4(speciesToDisplay(c), 1.0);
}
`;

const blurFS = FRAG_HEADER + `uniform sampler2D uSrc;
uniform vec2 uDir;
void main(){
  vec3 s = texture(uSrc,vUv).rgb*0.227027;
  s += texture(uSrc, vUv+uDir*1.3846).rgb*0.3162162;
  s += texture(uSrc, vUv-uDir*1.3846).rgb*0.3162162;
  s += texture(uSrc, vUv+uDir*3.2308).rgb*0.0702703;
  s += texture(uSrc, vUv-uDir*3.2308).rgb*0.0702703;
  fragColor = vec4(s, 1.0);
}
`;

const compositeFS = FRAG_HEADER + SPECIES + `uniform sampler2D uDye;
uniform sampler2D uLevel;
uniform sampler2D uRegions;
uniform sampler2D uBloom;
uniform sampler2D uVelocity;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform sampler2D uCurl;
uniform sampler2D uObstacle;
uniform sampler2D uScoreAcc;
uniform sampler2D uGel;
uniform sampler2D uMedia;
uniform sampler2D uAmp;
uniform vec2  uSimTexel;
uniform int   uDebugMode;
uniform float uTime;
uniform float uTonemapK;
uniform float uBloomStrength;
uniform float uSinkHeat;
uniform float uTriggerHeat;
uniform float uPulsePhase;
uniform float uPulseAmp;
uniform float uHueShift;
uniform float uFlowGlow;
uniform float uStreak;
uniform float uCurlTint;
uniform float uSchlieren;
uniform float uSpeciesFx;
uniform float uResScale;
vec3 hsv2rgb(vec3 c){
  vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
  vec3 p = abs(fract(c.xxx+K.xyz)*6.0-K.www);
  return c.z*mix(K.xxx, clamp(p-K.xxx,0.0,1.0), c.y);
}
vec3 hueRotate(vec3 col, float a){
  vec3 k = vec3(0.57735026);
  float c = cos(a), s = sin(a);
  return col*c + cross(k,col)*s + k*dot(k,col)*(1.0-c);
}
vec3 heatRamp(float h){
  vec3 c = mix(vec3(0.30,0.05,0.04), vec3(0.95,0.40,0.05), smoothstep(0.0,0.35,h));
  c = mix(c, vec3(1.00,0.85,0.25), smoothstep(0.35,0.70,h));
  c = mix(c, vec3(1.05,1.08,1.35), smoothstep(0.70,1.00,h));
  return c;
}
void main(){
  if(uDebugMode==1){
    vec2 dv = texture(uVelocity,vUv).xy; float m = length(dv);
    fragColor = vec4(hsv2rgb(vec3(atan(dv.y,dv.x)/6.2832+0.5, 0.85, clamp(m*0.012,0.0,1.0))),1.0); return;
  }
  if(uDebugMode==2){ fragColor = vec4(vec3(0.5+texture(uPressure,vUv).r*0.06),1.0); return; }
  if(uDebugMode==3){ float d=texture(uDivergence,vUv).r; fragColor = vec4(vec3(0.5)+vec3(d*2.0,-d*2.0,0.0),1.0); return; }
  if(uDebugMode==4){ float c=texture(uCurl,vUv).r; fragColor = vec4(vec3(0.5)+vec3(c,-c,0.0)*0.08,1.0); return; }
  if(uDebugMode==5){
    float d = texture(uLevel,vUv).r;
    vec3 c = d<0.0 ? vec3(0.85,0.30,0.20) : vec3(0.20,0.50,0.90);
    fragColor = vec4(c*(0.35+0.65*abs(sin(d*0.7))),1.0); return;
  }
  if(uDebugMode==6){ vec4 o=texture(uObstacle,vUv); fragColor = vec4(o.b, 0.5+o.r*0.01, 0.5+o.g*0.01, 1.0); return; }
  if(uDebugMode==7){
    vec4 s = texture(uScoreAcc,vUv);
    fragColor = vec4(vec3(1.0,0.6,0.2)*clamp(s.r*0.05,0.0,1.0) + vec3(0.1,0.5,0.7)*clamp(s.a*0.05,0.0,1.0),1.0); return;
  }
  if(uDebugMode==8){ float g=texture(uGel,vUv).r; fragColor = vec4(vec3(0.4,0.8,0.9)*clamp(g,0.0,1.0),1.0); return; }

  vec2 v = texture(uVelocity,vUv).xy;

/* ---------- JFA SDF ---------- */
function runFS(prog, rt, setup) { drawTo(rt); gl.useProgram(prog); setup(prog); fullscreen(); }
function runJFA() {
  for (let pass = 0; pass < 2; pass++) {
    runFS(P.jfaSeed, seeds.write, p => {
      bindTex(p, "uLevelPng", levelPngTex, 0);
      gl.uniform1f(U(p, "uInvert"), pass);
    });
    seeds.swap();
    let step = 1 << Math.ceil(Math.log2(Math.max(SIM_W, SIM_H)));
    const list = [];
    while (step >= 1) { list.push(step); step >>= 1; }
    list.push(1);
    for (const s of list) {
      runFS(P.jfaStep, seeds.write, p => {
        bindTex(p, "uSeeds", seeds.read.tex, 0);
        gl.uniform2f(U(p, "uSimTexel"), SIM_TEXEL[0], SIM_TEXEL[1]);
        gl.uniform2f(U(p, "uSimSize"), SIM_W, SIM_H);
        gl.uniform1f(U(p, "uStep"), s);
      });
      seeds.swap();
    }
    runFS(P.copy, pass === 0 ? seedSolid : seedEmpty, p => {
      bindTex(p, "uSrc", seeds.read.tex, 0);
      gl.uniform1f(U(p, "uMul"), 1.0);
    });
  }
  runFS(P.jfaCombine, distRT, p => {
    bindTex(p, "uLevelPng", levelPngTex, 0);
    bindTex(p, "uSolidSeeds", seedSolid.tex, 1);
    bindTex(p, "uEmptySeeds", seedEmpty.tex, 2);
    gl.uniform2f(U(p, "uSimSize"), SIM_W, SIM_H);
  });
  runFS(P.jfaGrad, level, p => {
    bindTex(p, "uDist", distRT.tex, 0);
    gl.uniform2f(U(p, "uSimTexel"), SIM_TEXEL[0], SIM_TEXEL[1]);
  });
}

/* ---------- actor table ---------- */
const cpuActors = new Array(N_ACTORS).fill(null);
let freeSlots = [], levelData = null;
function writeActor(slot, rows16) {
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  let data = rows16;
  if (HALF_FALLBACK) data = f32ToF16Arr(rows16);
  for (const rt of [actors.a, actors.b]) {
    gl.bindTexture(gl.TEXTURE_2D, rt.tex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, slot, 0, 1, ACTOR_ROWS, gl.RGBA, F32.type, data);
  }
}
function f32ToF16Arr(f32) {
  const out = new Uint16Array(f32.length);
  const fv = new Float32Array(1), iv = new Int32Array(fv.buffer);
  for (let i = 0; i < f32.length; i++) {
    fv[0] = f32[i]; const x = iv[0];
    const sign = (x >>> 16) & 0x8000;
    let exp = ((x >>> 23) & 0xff) - 127 + 15, man = (x >>> 13) & 0x3ff;
    if (exp <= 0) { exp = 0; man = 0; } else if (exp >= 31) { exp = 31; man = 0; }
    out[i] = sign | (exp << 10) | man;
  }
  return out;
}
function actorRecord(a) {
  const f = new Float32Array(16);
  f[0] = a.pos[0]; f[1] = a.pos[1];
  f[4] = a.type; f[5] = a.r;
  f[8] = -1;
  if (a.type === 5) {                 // piston
    f[6] = a.amp || 0.10; f[7] = a.angle != null ? a.angle : Math.PI / 2;
    f[9] = 1;
    f[10] = a.omega || 2.0; f[11] = a.phase || 0;
    f[13] = a.pos[0]; f[14] = a.pos[1];
  } else if (a.type === 6) {          // predator
    f[6] = a.predThrust || 0.45;
    f[8] = a.predTtl || 14; f[11] = Math.random() * 6.28;
    f[15] = a.predTtl || 14;          // r3.w = ttl0
  } else if (a.type === 7) {          // nest: r2.w = arm fraction (CPU refreshes)
    f[9] = 1; f[11] = 1.0;
  } else if (a.type === 8) {          // pickup: species color drives the glyph
    f[9] = 1;
    const sp = a.gives === "blue" ? [0, 0, 1] : a.gives === "green" ? [0, 1, 0] : [1, 1, 1];
    f[10] = sp[0]; f[11] = sp[1]; f[12] = sp[2];
  } else {
    f[6] = a.strength || 0; f[7] = a.angle || 0;
    f[9] = a.locked ? 1 : 0;
    const d = a.dye || [1, 1, 1];
    f[10] = d[0]; f[11] = d[1]; f[12] = a.dye ? d[2] : 0;
  }
  return f;
}
function clearActorSlot(slot) { writeActor(slot, new Float32Array(16)); }

/* ---------- level loading + gates ---------- */
let levelIdx = 0, state = "PLAY", paused = false;
function simTimeRef() { return simTime; }
let budget = { fan: 0, blue: 0, green: 0 };
const budgetOverrides = {};        // per-level session overrides from the panel
let emittedRed = 0, gateState = {}, simTime = 0;
let ghostAngle = 0, ghostPos = [0.5, 0.5], mouseInCanvas = false;
let pendingSpawn = null, debugMode = 0, lastSubsteps = 0, fps = 60;
let lastTelem = new Float32Array(TELEM_W * 4);
let selectedSlot = -1, selectedTool = 0;
const TOOLS = [
  { key: "fan", label: "FAN", type: 2, r: 6, dye: null, strengthKey: "fanStrength" },
  { key: "blue", label: "BLU", type: 3, r: 5, dye: BLUE, strengthKey: "blueEmitStrength" },
  { key: "green", label: "GRN", type: 3, r: 5, dye: GREEN, strengthKey: "greenEmitStrength" }
];
let prevDelivered = 0, captureEMA = 0, sensorEMA = 0, pulsePhase = 0, pulseAmp = 0.1;
let sinkHeat = 0, trigHeat = 0, winHoldT = 0, lastPulseT = performance.now() / 1000;
let rng = mulberry32(1);
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function rasterZones(zones, fill, write) {
  // build directly in GL orientation (v-up); no flip needed
  for (const z of zones || []) {
    const [u0, v0, u1, v1] = z.rect;
    const i0 = Math.max(0, Math.floor(u0 * SIM_W)), i1 = Math.min(SIM_W, Math.ceil(u1 * SIM_W));
    const j0 = Math.max(0, Math.floor(v0 * SIM_H)), j1 = Math.min(SIM_H, Math.ceil(v1 * SIM_H));
    for (let j = j0; j < j1; j++)
      for (let i = i0; i < i1; i++) write(z, (j * SIM_W + i));
  }
  return fill;
}
function refreshLevelTextures() {
  const L = curLevel();
  L.paint(gateState);
  const img = lvCtx.getImageData(0, 0, SIM_W, SIM_H);
  levelData = img.data;
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.bindTexture(gl.TEXTURE_2D, levelPngTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, SIM_W, SIM_H, 0, gl.RGBA, gl.UNSIGNED_BYTE,
    new Uint8Array(img.data.buffer.slice(0)));
  const n = SIM_W * SIM_H, reg = new Uint8Array(n * 4);
  for (let i = 0; i < n; i++) {
    const gv = img.data[i * 4 + 1], bv = img.data[i * 4 + 2];
    const g = gv > 127, bHigh = bv > 191, bLow = bv > 63 && bv <= 191;
    reg[i * 4]     = (g && !bHigh) ? 255 : 0;       // sink   (#00ff00)
    reg[i * 4 + 1] = (bHigh && !g) ? 255 : 0;       // drain  (#0000ff)
    reg[i * 4 + 2] = (g && bHigh) ? 255 : 0;        // trigger (#00ffff)
    reg[i * 4 + 3] = (bLow && !g) ? 255 : 0;        // sensor (#000080)
  }
  gl.bindTexture(gl.TEXTURE_2D, regionsTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, SIM_W, SIM_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, reg);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  // media + amp fields (data, not art)
  const med = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) { med[i * 4] = 1; med[i * 4 + 1] = 1; med[i * 4 + 2] = 1; }
  rasterZones(L.mediaZones, med, (z, i) => {
    med[i * 4] = z.curl != null ? z.curl : 1;
    med[i * 4 + 1] = z.velDiss != null ? z.velDiss : 1;
    med[i * 4 + 2] = z.dyeDiss != null ? z.dyeDiss : 1;
  });
  gl.bindTexture(gl.TEXTURE_2D, mediaTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, SIM_W, SIM_H, 0, gl.RGBA, gl.FLOAT, med);
  const amp = new Float32Array(n * 2);
  rasterZones(L.ampZones, amp, (z, i) => {
    amp[i * 2] = Math.cos(z.angle) * z.gain * RES_SCALE;
    amp[i * 2 + 1] = Math.sin(z.angle) * z.gain * RES_SCALE;
  });
  gl.bindTexture(gl.TEXTURE_2D, ampTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG16F, SIM_W, SIM_H, 0, gl.RG, gl.FLOAT, amp);
  runJFA();
}

let spinBudgetLeft = 0;
function loadLevel(idx) {
  levelIdx = idx < 0 ? -1 : Math.max(0, Math.min(LEVELS.length - 1, idx));
  const L = curLevel();
  gateState = {}; simTime = 0;
  rng = mulberry32(levelIdx * 1337 + 7);
  applyParamsForLevel();
  refreshLevelTextures();
  for (const rt of [velocity.a, velocity.b, pressure.a, pressure.b, dye.a, dye.b,
                    scoreAcc.a, scoreAcc.b, dynMask, divergence, curlTex, gel.a, gel.b,
                    actors.a, actors.b]) clearRT(rt);
  cpuActors.fill(null);
  freeSlots = [];
  for (let s = N_ACTORS - 1; s >= 1; s--) freeSlots.push(s);
  if (L.playerStart[0] >= 0) {
    writeActor(0, actorRecord({ type: 1, pos: L.playerStart, r: 5 }));
    cpuActors[0] = { type: 1, r: 5 };
  }
  for (const a of L.actors) {
    const slot = freeSlots.pop();
    writeActor(slot, actorRecord(a));
    cpuActors[slot] = Object.assign({ timer: a.type === 7 ? a.period : 0, slot }, a);
  }
  const ov = budgetOverrides[levelIdx] || {};
  budget = Object.assign({}, L.budgets, ov);
  emitRate = redEmitRate();
  state = levelIdx < 0 ? "ATTRACT" : "PLAY"; paused = false;
  emittedRed = 0; winHoldT = 0; prevDelivered = 0; captureEMA = 0; sensorEMA = 0;
  pendingSpawn = null; selectedSlot = -1;
  spinBudgetLeft = L.spinBudget != null ? L.spinBudget : params.spinBudget;
  document.getElementById("win").style.display = "none";
  document.getElementById("menu").style.display = levelIdx < 0 ? "flex" : "none";
  document.getElementById("options").style.display = "none";
  const inGame = levelIdx >= 0 ? "" : "none";
  hudEl.style.display = inGame; statsEl.style.display = inGame;
  document.getElementById("keys").style.display = inGame;
  syncBudgetInputs();
  updateHUDStatic();
}

function redEmitRate() {
  let r = 0;
  for (const a of cpuActors)
    if (a && a.type === 3 && a.dye)
      r += (a.strength || 0) * params.emitScale * EMIT_K *
        a.r * a.r * effScale() * effScale() * a.dye[0];
  return r;
}

/* ---------- input state ---------- */
const keys = new Set();
let inputVec = [0, 0], spinInput = 0;
function readInput() {
  let x = 0, y = 0;
  if (keys.has("a") || keys.has("arrowleft")) x -= 1;
  if (keys.has("d") || keys.has("arrowright")) x += 1;
  if (keys.has("s") || keys.has("arrowdown")) y -= 1;
  if (keys.has("w") || keys.has("arrowup")) y += 1;
  const l = Math.hypot(x, y);
  inputVec = l > 0 ? [x / l, y / l] : [0, 0];
  spinInput = (keys.has("q") ? 1 : 0) - (keys.has("e") ? 1 : 0);
  if (spinBudgetLeft <= 0) spinInput = 0;
}

/* ---------- substep ---------- */
function splat(prog, target, rt, extentMul) {
  drawTo(rt);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(prog);
  bindTex(prog, "uActors", actors.read.tex, 0);
  gl.uniform1i(U(prog, "uTarget"), target);
  gl.uniform2f(U(prog, "uSimTexel"), SIM_TEXEL[0], SIM_TEXEL[1]);
  gl.uniform1f(U(prog, "uExtentMul"), extentMul);
  gl.uniform1f(U(prog, "uEntityScale"), effScale());
  gl.uniform1f(U(prog, "uResScale"), RES_SCALE);
  gl.uniform1f(U(prog, "uDt"), DT);
  if (prog === P.splatDye) {
    gl.uniform1f(U(prog, "uEmitScale"), params.emitScale);
    gl.uniform1f(U(prog, "uEatRate"), PV("eatRate"));
  }
  if (prog === P.splatForce) gl.uniform1f(U(prog, "uPredSuck"), PV("predSuck"));
  gl.bindVertexArray(quadVAO);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N_ACTORS);
  gl.bindVertexArray(null);
  gl.disable(gl.BLEND);
}
function simUniforms(p) { gl.uniform2f(U(p, "uSimTexel"), SIM_TEXEL[0], SIM_TEXEL[1]); }

function substep() {
  runFS(P.actorUpdate, actors.write, p => {
    bindTex(p, "uActors", actors.read.tex, 0);
    bindTex(p, "uVelocity", velocity.read.tex, 1);
    bindTex(p, "uLevel", level.tex, 2);
    bindTex(p, "uDye", dye.read.tex, 3);
    simUniforms(p);
    gl.uniform1f(U(p, "uDt"), DT);
    gl.uniform1f(U(p, "uTime"), simTime);
    gl.uniform4f(U(p, "uInput"), inputVec[0], inputVec[1], spinInput, 0);
    gl.uniform1f(U(p, "uThrust"), params.thrust);
    gl.uniform1f(U(p, "uDragK"), params.dragK);
    gl.uniform1f(U(p, "uLinDamp"), params.linDamp);
    gl.uniform1f(U(p, "uSpinAccel"), params.spinAccel);
    gl.uniform1f(U(p, "uSpinDamp"), params.spinDamp);
    gl.uniform1f(U(p, "uSpinKick"), params.spinKick);
    gl.uniform1f(U(p, "uEntityScale"), effScale());
    gl.uniform1f(U(p, "uMassPlayer"), params.playerMass);
    gl.uniform1f(U(p, "uMassPred"), params.predMass);
    gl.uniform1f(U(p, "uMassPiston"), params.pistonMass);
    gl.uniform1f(U(p, "uRestitution"), params.restitution);
    gl.uniform1f(U(p, "uPistonSpring"), params.pistonSpring);
    gl.uniform1f(U(p, "uPistonDamp"), params.pistonDamp);
    if (pendingSpawn) {
      gl.uniform4f(U(p, "uSpawn"), pendingSpawn.slot, pendingSpawn.type,
        pendingSpawn.offset[0], pendingSpawn.offset[1]);
      gl.uniform4f(U(p, "uSpawnParams"), pendingSpawn.params[0], pendingSpawn.params[1],
        pendingSpawn.params[2], pendingSpawn.params[3]);
      gl.uniform4f(U(p, "uSpawnDye"), pendingSpawn.dye[0], pendingSpawn.dye[1], pendingSpawn.dye[2], 0);
    } else {
      gl.uniform4f(U(p, "uSpawn"), -1, 0, 0, 0);
      gl.uniform4f(U(p, "uSpawnParams"), 0, 0, 0, 0);
      gl.uniform4f(U(p, "uSpawnDye"), 0, 0, 0, 0);
    }
  });
  actors.swap();
  pendingSpawn = null;

  clearRT(dynMask);
  splat(P.splatMask, 2, dynMask, 1.1);

  if (GEL_ON) {
    runFS(P.gelUpdate, gel.write, p => {
      bindTex(p, "uGel", gel.read.tex, 0);
      bindTex(p, "uDye", dye.read.tex, 1);
      bindTex(p, "uVelocity", velocity.read.tex, 2);
      gl.uniform1f(U(p, "uGelReact"), PV("gelReact"));
      gl.uniform1f(U(p, "uGelDissolve"), PV("gelDissolve"));
      gl.uniform1f(U(p, "uGelErode"), PV("gelErode") / RES_SCALE);
      gl.uniform1f(U(p, "uDt"), DT);
    });
    gel.swap();
  }

  runFS(P.obstacleCompose, obstacle, p => {
    bindTex(p, "uLevel", level.tex, 0);
    bindTex(p, "uDynMask", dynMask.tex, 1);
    bindTex(p, "uGel", gel.read.tex, 2);
    gl.uniform1f(U(p, "uGelSolid"), PV("gelSolid"));
  });

  splat(P.splatForce, 0, velocity.read, 3.0);
  splat(P.splatDye, 1, dye.read, 3.0);

  runFS(P.advect, velocity.write, p => {
    bindTex(p, "uVelocity", velocity.read.tex, 0);
    bindTex(p, "uSource", velocity.read.tex, 1);
    bindTex(p, "uMedia", mediaTex, 2);
    gl.uniform1f(U(p, "uMediaChan"), 1);
    simUniforms(p);
    gl.uniform1f(U(p, "uDt"), DT);
    gl.uniform1f(U(p, "uDissipation"), params.velDiss);
  });
  velocity.swap();

  runFS(P.curl, curlTex, p => {
    bindTex(p, "uVelocity", velocity.read.tex, 0);
    simUniforms(p);
  });
  runFS(P.vorticity, velocity.write, p => {
    bindTex(p, "uVelocity", velocity.read.tex, 0);
    bindTex(p, "uCurl", curlTex.tex, 1);
    bindTex(p, "uMedia", mediaTex, 2);
    simUniforms(p);
    gl.uniform1f(U(p, "uCurlStrength"), params.curl);
    gl.uniform1f(U(p, "uDt"), DT);
  });
  velocity.swap();

  runFS(P.reactForce, velocity.write, p => {
    bindTex(p, "uVelocity", velocity.read.tex, 0);
    bindTex(p, "uDye", dye.read.tex, 1);
    bindTex(p, "uAmp", ampTex, 2);
    simUniforms(p);
    gl.uniform1f(U(p, "uExoForce"), PV("exoForce") * RES_SCALE);
    gl.uniform1f(U(p, "uDt"), DT);
  });
  velocity.swap();

  runFS(P.divergence, divergence, p => {
    bindTex(p, "uVelocity", velocity.read.tex, 0);
    bindTex(p, "uObstacle", obstacle.tex, 1);
    simUniforms(p);
  });
  runFS(P.copy, pressure.write, p => {
    bindTex(p, "uSrc", pressure.read.tex, 0);
    gl.uniform1f(U(p, "uMul"), params.warmStart);
  });
  pressure.swap();
  for (let i = 0; i < PRESSURE_ITERS; i++) {
    runFS(P.jacobi, pressure.write, p => {
      bindTex(p, "uPressure", pressure.read.tex, 0);
      bindTex(p, "uDivergence", divergence.tex, 1);
      bindTex(p, "uObstacle", obstacle.tex, 2);
      simUniforms(p);
    });
    pressure.swap();
  }
  runFS(P.gradientSubtract, velocity.write, p => {
    bindTex(p, "uPressure", pressure.read.tex, 0);
    bindTex(p, "uVelocity", velocity.read.tex, 1);
    bindTex(p, "uObstacle", obstacle.tex, 2);
    simUniforms(p);
    gl.uniform1f(U(p, "uGelDrag"), PV("gelDrag"));
    gl.uniform1f(U(p, "uDt"), DT);
  });
  velocity.swap();

  runFS(P.advect, dye.write, p => {
    bindTex(p, "uVelocity", velocity.read.tex, 0);
    bindTex(p, "uSource", dye.read.tex, 1);
    bindTex(p, "uMedia", mediaTex, 2);
    gl.uniform1f(U(p, "uMediaChan"), 2);
    simUniforms(p);
    gl.uniform1f(U(p, "uDt"), DT);
    gl.uniform1f(U(p, "uDissipation"), params.dyeDiss);
  });
  dye.swap();   // dye.read is PRE-absorption

  runFS(P.dyePost, dye.write, p => {
    bindTex(p, "uDye", dye.read.tex, 0);
    bindTex(p, "uRegions", regionsTex, 1);
    bindTex(p, "uObstacle", obstacle.tex, 2);
    gl.uniform1f(U(p, "uAbsorbRate"), params.absorb);
    gl.uniform1f(U(p, "uDrainRate"), params.drainRate);
    gl.uniform1f(U(p, "uSolidDecay"), params.solidDecay);
    gl.uniform1f(U(p, "uExoConsume"), PV("exoConsume"));
    gl.uniform1f(U(p, "uGelConsume"), PV("gelConsume"));
    gl.uniform1f(U(p, "uDt"), DT);
  });
  runFS(P.scoreAccum, scoreAcc.write, p => {
    bindTex(p, "uScoreAcc", scoreAcc.read.tex, 0);
    bindTex(p, "uDye", dye.read.tex, 1);
    bindTex(p, "uRegions", regionsTex, 2);
    gl.uniform1f(U(p, "uAbsorbRate"), params.absorb);
    gl.uniform1f(U(p, "uDrainRate"), params.drainRate);
    gl.uniform1f(U(p, "uDt"), DT);
    gl.uniform1f(U(p, "uActive"), SCORE_SCALE);
  });
  scoreAcc.swap();
  dye.swap();

  emittedRed += emitRate * DT;
  simTime += DT;
}

/* ---------- readback ---------- */
class ReadbackChannel {
  constructor() {
    this.slots = [];
    for (let i = 0; i < 3; i++) {
      const pbo = gl.createBuffer();
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
      gl.bufferData(gl.PIXEL_PACK_BUFFER, TELEM_W * 4 * 4, gl.STREAM_READ);
      this.slots.push({ pbo, fence: null });
    }
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    this.cursor = 0;
    this.latest = lastTelem;
    this.ageFrames = 0;
  }
  kick(fbo) {
    const s = this.slots[this.cursor];
    if (s.fence) return;
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, s.pbo);
    gl.readPixels(0, 0, TELEM_W, 1, gl.RGBA, gl.FLOAT, 0);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    s.fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    this.cursor = (this.cursor + 1) % this.slots.length;
  }
  poll() {
    this.ageFrames++;
    for (const s of this.slots) {
      if (!s.fence) continue;
      if (gl.getSyncParameter(s.fence, gl.SYNC_STATUS) === gl.SIGNALED) {
        gl.deleteSync(s.fence); s.fence = null;
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, s.pbo);
        gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, this.latest);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        this.ageFrames = 0;
      }
    }
    return this.latest;
  }
}
const readback = new ReadbackChannel();

/* ---------- render ---------- */
function runReduce(srcTex) {
  let tex = srcTex, sw = SIM_W, sh = SIM_H;
  for (const rt of reduceChain) {
    runFS(P.reduce, rt, p => {
      bindTex(p, "uSrc", tex, 0);
      gl.uniform2i(U(p, "uSrcSize"), sw, sh);
    });
    tex = rt.tex; sw = rt.w; sh = rt.h;
  }
  return reduceChain[reduceChain.length - 1];
}
function renderFrame(now) {
  const r1 = runReduce(scoreAcc.read.tex);
  runFS(P.copy, scoreOne, p => {
    bindTex(p, "uSrc", r1.tex, 0);
    gl.uniform1f(U(p, "uMul"), 1.0);
  });
  runFS(P.sensor, sensorRT, p => {
    bindTex(p, "uDye", dye.read.tex, 0);
    bindTex(p, "uVelocity", velocity.read.tex, 1);
    bindTex(p, "uRegions", regionsTex, 2);
  });
  const r2 = runReduce(sensorRT.tex);
  runFS(P.telemetry, telemetry, p => {
    bindTex(p, "uScoreOne", scoreOne.tex, 0);
    bindTex(p, "uSensorReduced", r2.tex, 1);
    bindTex(p, "uActors", actors.read.tex, 2);
  });
  readback.kick(telemetry.fbo);
  const t = readback.poll();

  runFS(P.bright, bloomA, p => {
    bindTex(p, "uDye", dye.read.tex, 0);
    gl.uniform1f(U(p, "uThreshold"), params.bloomThr);
    gl.uniform3f(U(p, "uBloomW"), 1.0, 0.5, 0.6);
  });
  let bsrc = bloomA, bdst = bloomB;
  for (let i = 0; i < BLUR_PASSES; i++) {
    const dir = i % 2 === 0 ? [SIM_TEXEL[0], 0] : [0, SIM_TEXEL[1]];
    runFS(P.blur, bdst, p => {
      bindTex(p, "uSrc", bsrc.tex, 0);
      gl.uniform2f(U(p, "uDir"), dir[0], dir[1]);
    });
    const tmp = bsrc; bsrc = bdst; bdst = tmp;
  }

  drawTo(null);
  const C = P.composite;
  gl.useProgram(C);
  bindTex(C, "uDye", dye.read.tex, 0);
  bindTex(C, "uLevel", level.tex, 1);
  bindTex(C, "uRegions", regionsTex, 2);
  bindTex(C, "uBloom", bsrc.tex, 3);
  bindTex(C, "uVelocity", velocity.read.tex, 4);
  bindTex(C, "uPressure", pressure.read.tex, 5);
  bindTex(C, "uDivergence", divergence.tex, 6);
  bindTex(C, "uCurl", curlTex.tex, 7);
  bindTex(C, "uObstacle", obstacle.tex, 8);
  bindTex(C, "uScoreAcc", scoreAcc.read.tex, 9);
  bindTex(C, "uGel", gel.read.tex, 10);
  bindTex(C, "uMedia", mediaTex, 11);
  bindTex(C, "uAmp", ampTex, 12);
  simUniforms(C);
  gl.uniform1i(U(C, "uDebugMode"), debugMode);
  gl.uniform1f(U(C, "uTime"), now / 1000);
  gl.uniform1f(U(C, "uTonemapK"), params.tonemapK);
  gl.uniform1f(U(C, "uBloomStrength"), params.bloomStr);
  gl.uniform1f(U(C, "uSinkHeat"), sinkHeat);
  gl.uniform1f(U(C, "uTriggerHeat"), trigHeat);
  gl.uniform1f(U(C, "uPulsePhase"), pulsePhase);
  gl.uniform1f(U(C, "uPulseAmp"), pulseAmp);
  gl.uniform1f(U(C, "uHueShift"), params.hueShift);
  gl.uniform1f(U(C, "uFlowGlow"), params.flowGlow);
  gl.uniform1f(U(C, "uStreak"), params.streak);
  gl.uniform1f(U(C, "uCurlTint"), params.curlTint);
  gl.uniform1f(U(C, "uSchlieren"), params.schlieren);
  gl.uniform1f(U(C, "uSpeciesFx"), params.speciesFx);
  gl.uniform1f(U(C, "uResScale"), RES_SCALE);
  fullscreen();

  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P.glyph);
  bindTex(P.glyph, "uActors", actors.read.tex, 0);
  gl.uniform2f(U(P.glyph, "uSimTexel"), SIM_TEXEL[0], SIM_TEXEL[1]);
  gl.uniform1f(U(P.glyph, "uExtentMul"), 1.8);
  gl.uniform1f(U(P.glyph, "uEntityScale"), effScale());
  gl.uniform1f(U(P.glyph, "uGhost"), 0);
  gl.uniform1f(U(P.glyph, "uGhostValid"), 0);
  gl.uniform1i(U(P.glyph, "uSelected"), selectedSlot);
  gl.bindVertexArray(quadVAO);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N_ACTORS);
  if (mouseInCanvas && selectedSlot < 0 && state !== "ATTRACT") {
    const tool = TOOLS[selectedTool];
    gl.useProgram(P.ghost);
    gl.uniform2f(U(P.ghost, "uGhostPos"), ghostPos[0], ghostPos[1]);
    gl.uniform1f(U(P.ghost, "uGhostRadius"), tool.r);
    gl.uniform1f(U(P.ghost, "uGhostAngle"), ghostAngle);
    gl.uniform1f(U(P.ghost, "uGhostType"), tool.type);
    const d = tool.dye || [1, 1, 1];
    gl.uniform4f(U(P.ghost, "uGhostDye"), d[0], d[1], d[2], 0);
    gl.uniform2f(U(P.ghost, "uSimTexel"), SIM_TEXEL[0], SIM_TEXEL[1]);
    gl.uniform1f(U(P.ghost, "uExtentMul"), 1.8);
    gl.uniform1f(U(P.ghost, "uEntityScale"), effScale());
    gl.uniform1f(U(P.ghost, "uGhost"), 1);
    gl.uniform1f(U(P.ghost, "uGhostValid"), placementValid(ghostPos) ? 1 : 0);
    gl.uniform1i(U(P.ghost, "uSelected"), -1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  gl.bindVertexArray(null);
  gl.disable(gl.BLEND);

  updateHUD(t, now);
}

/* ---------- placement / tools ---------- */
let emitRate = 0;
function placementValid(uv) {
  const tool = TOOLS[selectedTool];
  if ((budget[tool.key] | 0) <= 0) return false;
  if (uv[0] < 0.02 || uv[0] > 0.98 || uv[1] < 0.02 || uv[1] > 0.98) return false;
  if (!levelData) return false;
  const px = Math.min(SIM_W - 1, Math.max(0, Math.floor(uv[0] * SIM_W)));
  const py = Math.min(SIM_H - 1, Math.max(0, Math.floor((1 - uv[1]) * SIM_H)));
  return levelData[(py * SIM_W + px) * 4] < 128;   // not inside a solid
}
function toolRecord(tool, pos, angle) {
  const strength = params[tool.strengthKey];
  return tool.type === 2
    ? { type: 2, pos, angle, r: tool.r, strength, toolKey: tool.key }
    : { type: 3, pos, angle, r: tool.r, strength, dye: tool.dye, toolKey: tool.key };
}
function placeTool(uv) {
  if (!placementValid(uv) || !freeSlots.length) return;
  const tool = TOOLS[selectedTool];
  const slot = freeSlots.pop();
  const rec = toolRecord(tool, [uv[0], uv[1]], ghostAngle);
  writeActor(slot, actorRecord(rec));
  cpuActors[slot] = Object.assign({ slot }, rec);
  budget[tool.key]--;
  emitRate = redEmitRate();
  syncBudgetInputs();
}
function spawnAtPlayer() {
  const tool = TOOLS[selectedTool];
  if ((budget[tool.key] | 0) <= 0 || !freeSlots.length || pendingSpawn) return;
  const slot = freeSlots.pop();
  const strength = params[tool.strengthKey];
  pendingSpawn = {
    slot, type: tool.type, offset: [0.06, 0],
    params: [tool.r, strength, ghostAngle, -1],
    dye: tool.dye || [0, 0, 0]
  };
  cpuActors[slot] = { slot, type: tool.type, r: tool.r, strength, angle: ghostAngle,
    dye: tool.dye, toolKey: tool.key, pos: null };
  budget[tool.key]--;
  emitRate = redEmitRate();
  syncBudgetInputs();
}
function toolKeyOf(a) {
  return a.toolKey || (a.type === 2 ? "fan" : (a.dye && a.dye[2] > 0.5 ? "blue" : "green"));
}
function deleteSelected() {
  if (selectedSlot < 1) return;
  const a = cpuActors[selectedSlot];
  if (!a || a.locked || (a.type !== 2 && a.type !== 3)) return;
  clearActorSlot(selectedSlot);
  cpuActors[selectedSlot] = null;
  freeSlots.push(selectedSlot);
  budget[toolKeyOf(a)] = (budget[toolKeyOf(a)] | 0) + 1;
  selectedSlot = -1;
  emitRate = redEmitRate();
  syncBudgetInputs();
}
function rotateSelected(dir) {
  const a = cpuActors[selectedSlot];
  if (!a || (a.locked && !a.rotatable)) return;
  a.angle = (a.angle || 0) + dir * Math.PI / 12;
  const px = lastTelem[(2 + selectedSlot) * 4], py = lastTelem[(2 + selectedSlot) * 4 + 1];
  if (px || py) a.pos = [px, py];
  if (!a.pos) return;            // telemetry hasn't reported it yet; try next tick
  writeActor(selectedSlot, actorRecord(a));
}
function updateSelection() {
  selectedSlot = -1;
  if (!mouseInCanvas) return;
  let bestD = 0.05;
  for (let s = 1; s < N_ACTORS; s++) {
    const a = cpuActors[s];
    if (!a || (a.type !== 2 && a.type !== 3)) continue;
    if (a.locked && !a.rotatable) continue;
    const px = lastTelem[(2 + s) * 4], py = lastTelem[(2 + s) * 4 + 1];
    if (!px && !py) continue;
    const d = Math.hypot(px - ghostPos[0], py - ghostPos[1]);
    if (d < bestD) { bestD = d; selectedSlot = s; }
  }
}

/* ---------- nests (CPU-timed spawning, seeded; GPU never spawns) ---------- */
function updateNests(steps) {
  if (!steps) return;
  for (const a of cpuActors) {
    if (!a || a.type !== 7) continue;
    a.timer -= steps * DT;
    if (a.timer <= 0) {
      if (freeSlots.length) {
        const slot = freeSlots.pop();
        writeActor(slot, actorRecord({ type: 6, pos: a.pos, r: 6,
          predThrust: a.predThrust, predTtl: a.predTtl }));
        cpuActors[slot] = { slot, type: 6, death: simTime + (a.predTtl || 14) + 0.5 };
      }
      a.timer = a.period * (1 + (a.jitter || 0) * (rng() * 2 - 1));
    }
    const f = actorRecord(a);
    f[11] = Math.max(0, Math.min(1, a.timer / a.period));   // iris arm fraction
    writeActor(a.slot, f);
  }
  for (let s = 1; s < N_ACTORS; s++) {
    const a = cpuActors[s];
    if (a && a.type === 6 && a.death != null && simTime > a.death) {
      cpuActors[s] = null; freeSlots.push(s);               // GPU TTL already zeroed it
    }
  }
}

/* ---------- pickups, messages, toasts ---------- */
const msgEl = document.getElementById("msg");
const toastEl = document.getElementById("toast");
let toastUntil = 0;
function showToast(text) { toastEl.textContent = text; toastUntil = performance.now() / 1000 + 2.6; }
function updateOverlays(now) {
  const L = curLevel();
  let active = null;
  for (const m of L.messages || [])
    if (simTime >= m.t && simTime < m.t + m.dur) { active = m; break; }
  if (active) msgEl.textContent = active.text;
  msgEl.style.opacity = active ? 1 : 0;
  toastEl.style.opacity = now / 1000 < toastUntil ? 1 : 0;
}
function checkPickups() {
  if (state === "ATTRACT") return;
  const px = lastTelem[8], py = lastTelem[9];          // player = telemetry pixel 2
  if (!px && !py) return;
  for (let s = 1; s < N_ACTORS; s++) {
    const a = cpuActors[s];
    if (!a || a.type !== 8) continue;
    const reach = (5 + (a.r || 5)) * effScale() * Math.max(SIM_TEXEL[0], SIM_TEXEL[1]);
    if (Math.hypot(px - a.pos[0], py - a.pos[1]) < reach) {
      budget[a.gives] = (budget[a.gives] | 0) + (a.count || 1);
      showToast("+" + (a.count || 1) + " " + a.gives.toUpperCase() +
        (a.gives === "fan" ? "" : " EMITTER") + " collected");
      clearActorSlot(s); cpuActors[s] = null; freeSlots.push(s);
      syncBudgetInputs();
    }
  }
}

/* ---------- HUD, gates, win ---------- */
const hudEl = document.getElementById("hud");
const statsEl = document.getElementById("stats");
function updateHUDStatic() {
  hudEl.textContent = curLevel().name;
}
function evalGates(pdt) {
  const L = curLevel();
  if (!L.gates) return;
  let changed = false;
  const trigBank = lastTelem[3] / SCORE_SCALE;
  for (const g of L.gates) {
    const cur = !!gateState[g.id];
    let next = cur;
    if (g.kind === "trigger") {
      const frac = emittedRed > 1e-6 ? trigBank / emittedRed : 0;
      trigHeat = Math.min(frac / Math.max(g.threshold, 1e-6), 1);
      if (!cur && frac >= g.threshold) next = true;          // latches open
      if (cur) trigHeat = 1;
    } else {
      if (!cur) {
        if (sensorEMA >= g.threshold) next = true;
        g._below = 0;
      } else {
        const rel = g.releaseBelow != null ? g.releaseBelow : g.threshold * 0.6;
        if (sensorEMA < rel) {
          g._below = (g._below || 0) + pdt;
          if (g._below > 0.5) next = false;                  // hysteresis + dwell
        } else g._below = 0;
      }
    }
    if (next !== cur) { gateState[g.id] = next; changed = true; }
  }
  if (changed) refreshLevelTextures();
}
function updateHUD(t, now) {
  const tNow = now / 1000;
  const pdt = Math.max(1e-3, Math.min(0.25, tNow - lastPulseT));
  lastPulseT = tNow;
  if (state === "ATTRACT") { pulsePhase += pdt * 3; return; }
  const L = curLevel();
  const delivered = t[0] / SCORE_SCALE;
  const sensorRaw = t[4];
  if (!paused) {
    const inst = Math.max(0, Math.min(2, (delivered - prevDelivered) / pdt / Math.max(emitRate, 1e-6)));
    const k = 1 - Math.exp(-pdt / 0.5);
    captureEMA += k * (inst - captureEMA);
    const k2 = 1 - Math.exp(-pdt / 0.4);
    sensorEMA += k2 * (sensorRaw / RES_SCALE / Math.max(emitRate, 1e-6) - sensorEMA);
    evalGates(pdt);
  }
  prevDelivered = delivered;

  const need = L.winFraction * params.winScale;
  if (state === "PLAY" && !paused) {
    if (captureEMA >= need) {
      winHoldT += pdt;
      if (winHoldT >= (L.winHoldSec || 4)) {
        state = "WIN";
        document.getElementById("win").style.display = "flex";
      }
    } else winHoldT = Math.max(0, winHoldT - pdt * 2);
  }
  sinkHeat = Math.min(captureEMA / Math.max(need, 1e-3), 1);
  pulsePhase += pdt * (2 + 9 * sinkHeat);
  pulseAmp = 0.10 + 0.55 * sinkHeat;

  const cum = emittedRed > 1e-6 ? delivered / emittedRed : 0;
  let txt = L.name +
    "  \u2502  capture " + (captureEMA * 100).toFixed(0) + "% / need " + (need * 100).toFixed(0) + "%" +
    "  \u2502  hold " + winHoldT.toFixed(1) + "/" + (L.winHoldSec || 4) + "s" +
    "  \u2502  total " + (cum * 100).toFixed(1) + "%";
  if (L.gates) {
    const gtxt = L.gates.map(g => g.id + (gateState[g.id] ? "\u25cf" : "\u25cb")).join(" ");
    txt += "  \u2502  locks " + gtxt;
    if (L.gates.some(g => g.kind === "sensor")) txt += " (flux " + sensorEMA.toFixed(2) + ")";
  }
  txt += "\nF" + (budget.fan | 0) + " B" + (budget.blue | 0) + " G" + (budget.green | 0) +
    "  \u2502  spin " + spinBudgetLeft.toFixed(0) + "s" +
    "  \u2502  tool [" + TOOLS[selectedTool].label + "]" +
    (paused ? "  \u2502  \u23f8 PAUSED" : "") +
    (anyPulseActive() ? "  \u2502  \u2697 DESTABILIZED" : "") +
    (state === "WIN" ? "  \u2502  \u2713 SUSTAINED \u2014 N for next" : "");
  hudEl.textContent = txt;
  statsEl.textContent = fps.toFixed(0) + " fps \u00b7 " + lastSubsteps + " sub \u00b7 telem age " +
    readback.ageFrames + " \u00b7 emit " + emitRate.toFixed(0) + " \u00b7 dbg " + debugMode;
}

  ["gelReact", 0, 12, 0.1], ["gelDissolve", 0, 1, 0.01], ["gelErode", 0, 0.2, 0.002],
  ["gelDrag", 0, 20, 0.1], ["gelSolid", 0.1, 1.5, 0.01], ["gelConsume", 0, 5, 0.05],
  ["exoForce", 0, 12000, 100], ["exoConsume", 0, 5, 0.05], ["eatRate", 0, 12, 0.1],
  ["warmStart", 0, 1, 0.01], ["tonemapK", 0.05, 1, 0.01],
  ["bloomStr", 0, 1, 0.01], ["bloomThr", 0, 4, 0.05],
  ["hueShift", -3.14, 3.14, 0.01], ["flowGlow", 0, 2, 0.02], ["streak", 0, 3, 0.02],
  ["curlTint", 0, 1, 0.01], ["schlieren", 0, 2, 0.02], ["speciesFx", 0, 2, 0.02],
  ["winScale", 0.2, 3, 0.05]
];
const panelEl = document.getElementById("panel");
let panelOpen = false;
function buildPanel() {
  let h = '<div class="ph">FLUX ROUTE \u00b7 tuning <span style="float:right;cursor:pointer" id="pclose">\u00d7</span></div>';
  h += '<div class="prow"><label>quality</label><select id="qualSel">' +
    Object.keys(QUALITY_PRESETS).map(q =>
      '<option value="' + q + '"' + (q === qualityName ? " selected" : "") + ">" + q + "</option>").join("") +
    "</select> <span class=\"dim\">(reloads)</span></div>";
  h += '<div class="prow"><label>config</label><select id="cfgSel"></select> ' +
    '<button id="cfgSave">save</button><button id="cfgSaveAs">save as</button>' +
    '<button id="cfgDel">del</button></div>';
  h += '<div class="prow"><button id="cfgExp">export</button><button id="cfgImp">import</button>' +
    '<button id="cfgRevert">revert to level</button></div>';
  h += '<textarea id="cfgIO" rows="3" spellcheck="false" placeholder="config JSON"></textarea>';
  h += '<div class="ph2">budgets (this level)</div><div class="prow">' +
    ['fan', 'blue', 'green'].map(k =>
      '<label style="width:auto;margin-right:4px">' + k + '</label>' +
      '<input type="number" min="0" max="40" id="b_' + k + '" style="width:3.2em;margin-right:10px">').join("") +
    "</div>";
  h += '<div class="ph2">parameters</div>';
  for (const [k, mn, mx, st] of SLIDERS) {
    h += '<div class="prow"><label>' + k + '</label>' +
      '<input type="range" id="s_' + k + '" min="' + mn + '" max="' + mx + '" step="' + st + '">' +
      '<span class="pv" id="v_' + k + '"></span></div>';
  }
  panelEl.innerHTML = h;
  document.getElementById("pclose").onclick = togglePanel;
  document.getElementById("qualSel").onchange = e => {
    try { localStorage.setItem("fluxroute.quality", e.target.value); } catch (er) {}
    location.reload();
  };
  for (const [k] of SLIDERS) {
    const el = document.getElementById("s_" + k);
    el.oninput = () => {
      params[k] = parseFloat(el.value);
      dirtyKeys.add(k); dirtyVals[k] = params[k];
      emitRate = redEmitRate();    // emitScale/entityScale change red emission
      document.getElementById("v_" + k).textContent = fmtVal(params[k]);
    };
  }
  for (const k of ["fan", "blue", "green"]) {
    const el = document.getElementById("b_" + k);
    el.onchange = () => {
      budget[k] = Math.max(0, parseInt(el.value) || 0);
      budgetOverrides[levelIdx] = Object.assign({}, budgetOverrides[levelIdx], { [k]: budget[k] });
    };
  }
  document.getElementById("cfgSel").onchange = e => {
    activeName = e.target.value;
    persistConfigs();
    dirtyKeys.clear();
    applyParamsForLevel();
  };
  document.getElementById("cfgSave").onclick = () =>
    saveConfigAs(activeName || prompt("config name:", "my-config"));
  document.getElementById("cfgSaveAs").onclick = () =>
    saveConfigAs(prompt("config name:", activeName || "my-config"));
  document.getElementById("cfgDel").onclick = () => {
    if (activeName && configs[activeName]) {
      delete configs[activeName]; activeName = "";
      persistConfigs(); rebuildConfigSelect(); applyParamsForLevel();
    }
  };
  document.getElementById("cfgExp").onclick = () => {
    document.getElementById("cfgIO").value = JSON.stringify(
      configs[activeName] || { name: "current", ver: 1, quality: qualityName, params });
  };
  document.getElementById("cfgImp").onclick = () => {
    try {
      const c = JSON.parse(document.getElementById("cfgIO").value);
      if (!c || typeof c.params !== "object") throw new Error("no params");
      const known = {};
      for (const k in c.params) if (k in DEFAULT_PARAMS) known[k] = c.params[k];
        else console.warn("import: ignoring unknown key", k);
      c.params = known;
      configs[c.name || "imported"] = c; activeName = c.name || "imported";
      dirtyKeys.clear();
      persistConfigs(); rebuildConfigSelect(); applyParamsForLevel();
    } catch (e) { alert("Import failed: " + e.message); }
  };
  document.getElementById("cfgRevert").onclick = () => { dirtyKeys.clear(); applyParamsForLevel(); };
  rebuildConfigSelect();
  syncSliders();
  syncBudgetInputs();
}
function fmtVal(v) { return Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 1 ? v.toFixed(2) : v.toFixed(3); }
function rebuildConfigSelect() {
  const sel = document.getElementById("cfgSel");
  if (!sel) return;
  sel.innerHTML = '<option value="">(defaults)</option>' +
    Object.keys(configs).map(n =>
      '<option value="' + n + '"' + (n === activeName ? " selected" : "") + ">" + n + "</option>").join("");
}
function syncSliders() {
  for (const [k] of SLIDERS) {
    const el = document.getElementById("s_" + k);
    if (!el) return;
    el.value = params[k];
    document.getElementById("v_" + k).textContent = fmtVal(params[k]);
  }
}
function syncBudgetInputs() {
  for (const k of ["fan", "blue", "green"]) {
    const el = document.getElementById("b_" + k);
    if (el) el.value = budget[k] | 0;
  }
}
function togglePanel() {
  panelOpen = !panelOpen;
  panelEl.style.display = panelOpen ? "block" : "none";
}

/* ---------- events ---------- */
function canvasUV(e) {
  const r = canvas.getBoundingClientRect();
  const sc = Math.min(r.width / 16, r.height / 9);
  const w = sc * 16, h = sc * 9;
  const x0 = r.left + (r.width - w) / 2, y0 = r.top + (r.height - h) / 2;
  return [(e.clientX - x0) / w, 1 - (e.clientY - y0) / h];
}
canvas.addEventListener("mousemove", e => {
  const uv = canvasUV(e);
  ghostPos = uv;
  mouseInCanvas = uv[0] >= 0 && uv[0] <= 1 && uv[1] >= 0 && uv[1] <= 1;
});
canvas.addEventListener("mouseleave", () => { mouseInCanvas = false; });
canvas.addEventListener("mousedown", e => {
  if (e.button === 0 && mouseInCanvas && selectedSlot < 0) placeTool(ghostPos);
});
canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  if (selectedSlot >= 1) deleteSelected();
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const dir = e.deltaY > 0 ? -1 : 1;
  if (selectedSlot >= 1) rotateSelected(dir);
  else ghostAngle += dir * Math.PI / 12;
}, { passive: false });
window.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toUpperCase();
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  keys.add(k);
  if (k === "escape") { if (levelIdx >= 0) loadLevel(-1); return; }
  if (levelIdx < 0 && k !== "t" && k !== "tab") return;
  if (k === "1") selectedTool = 0;
  else if (k === "2") selectedTool = 1;
  else if (k === "3") selectedTool = 2;
  else if (k === "f") spawnAtPlayer();
  else if (k === "r") loadLevel(levelIdx);
  else if (k === "[") loadLevel(levelIdx - 1);
  else if (k === "]") loadLevel(levelIdx + 1);
  else if (k === "n" && state === "WIN") loadLevel(levelIdx + 1);
  else if (k === " ") { paused = !paused; e.preventDefault(); }
  else if (k === "tab") { debugMode = (debugMode + 1) % 9; e.preventDefault(); }
  else if (k === "t") togglePanel();
  else if (k === "x") {           /* demo of event-driven chemistry pulses */
    pulseParam("exoConsume", 0.15, 2.5);
    pulseParam("exoForce", params.exoForce * 3, 2.5);
  }
  if (["arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
});
window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

/* ---------- main loop ---------- */
let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dtW = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  readInput();
  let steps = 0;
  if (!paused && document.visibilityState !== "hidden") {
    acc += dtW;
    while (acc >= DT && steps < MAX_SUBSTEPS) { substep(); acc -= DT; steps++; }
    if (steps === MAX_SUBSTEPS) acc = 0;
  } else acc = 0;
  lastSubsteps = steps;
  if (spinInput !== 0 && state === "PLAY")
    spinBudgetLeft = Math.max(0, spinBudgetLeft - steps * DT);
  updateNests(steps);
  checkPickups();
  updateOverlays(now);
  updateSelection();
  fps += (1 / Math.max(dtW, 1e-4) - fps) * 0.05;
  renderFrame(now);
}

document.getElementById("btnPlay").onclick = () => loadLevel(0);
document.getElementById("btnOptions").onclick = () => {
  document.getElementById("options").style.display = "flex";
};
document.getElementById("optClose").onclick = () => {
  document.getElementById("options").style.display = "none";
};
document.getElementById("optTune").onclick = () => {
  document.getElementById("options").style.display = "none";
  if (!panelOpen) togglePanel();
};
{
  const q = document.getElementById("optQual");
  q.innerHTML = Object.keys(QUALITY_PRESETS).map(n =>
    '<option value="' + n + '"' + (n === qualityName ? " selected" : "") + ">" + n + "</option>").join("");
  q.onchange = e => {
    try { localStorage.setItem("fluxroute.quality", e.target.value); } catch (er) {}
    location.reload();
  };
}
buildPanel();
loadLevel(-1);          /* boot into the attract loop + start menu */
requestAnimationFrame(frame);
})();

</script>
</body>
