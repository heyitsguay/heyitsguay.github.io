                  ### PhD Research: Modeling sparse sensory coding

                  - **Goal**: Understand the relationship between neural population sparsity, temporal sparsity, and the "[sparse coding hypothesis](https://bernstein-network.de/wp-content/uploads/2021/03/Lecture-15-Sparse-coding-2020.pdf)" for locust olfaction.
                  - **Sparse coding hypothesis**: "Natural" signals lie near low-dimensional manifolds in state space.
                    - Neuron populations form sparse overcomplete representations tuned to natural signals, for efficiency and separability.
                    - Sounds like the signal processing concept of sparse representation, but drawing an exact connection was challenging.
              </textarea>
          </section>

          <section data-markdown class="compact" data-background="linear-gradient(#62628480, #99999980)">

                  ### PhD Research: Modeling sparse sensory coding

                  - **Locust olfaction at a glance**
                    - **High-dimensional molecule config space** sampled by many olfactory receptor types (ORNs).
                    - ORNs -> excitatory PNs + inhibitory LNs, inhibition waves shape PN activity into windowed time-varying functions (**higher-dimensional projection**).
                    - PNs trigger overcomplete KCs in the olfactory bulb, **KC population response is sparse**.
              </textarea>

          <section data-markdown class="compact" data-background="linear-gradient(#62628480, #99999980)">
              <textarea data-template>
                  ### PhD Research: Compressed sensing for electron tomography

                  - **Compressed sensing** (CS): Recover an $s$-sparse signal $u \in \mathbb{R}^n$ from few measurements $y = Au + e$, where $A \in \mathbb{R}^{m\times n}$ with $m \ll n$ and $\|e\|_2 \le \varepsilon$.
                    - **Recover** by $\ell_1$-minimization (LASSO):  $\displaystyle \hat{u} = \arg\min_x \tfrac{1}{2}\|Ax - y\|_2^2 + \lambda\|x\|_1$
                    - **Guarantee:** if $A$ has RIP with $\delta_{2s} < \sqrt{2}-1$, then $\|\hat{u} - u\|_2 \le C\varepsilon$  (exact recovery when $e=0$)
                    - **Random matrices work:** Gaussian $A$ satisfies this w.h.p. once $m \gtrsim s\log(n/s)$
              </textarea>
          </section>

          <section data-markdown class="compact" data-background="linear-gradient(#62628480, #99999980)">
              <textarea data-template>
                  ### PhD Research: Compressed sensing for electron tomography

                  - **Electron tomography** (ET): Tilt a specimen through many angles; each tilt image is a set of line integrals of the specimen's electron scattering density $f$ along the beam.
                    - **Projection = Radon transform.** Each angle $\theta$ yields
                      $$p_\theta(r) = \mathcal{R}f(\theta,r) = \iint f(x,y)\,\delta(x\cos\theta + y\sin\theta - r)\,dx\,dy$$
                    - **Filtered backprojection.** Real-space recovery formula with a ramp filter correcting the polar $1/|\omega|$ sampling density:
                      $$f(x,y) = \int\_0^\pi (p\_{\theta} * h)(x\cos\theta + y\sin\theta)\,d\theta, \qquad \hat{h}(\omega) = |\omega|$$
                    - **The missing wedge.** Mechanical tilt is limited to ≈ ±70°, leaving a wedge of Fourier space unmeasured; sparsity/compressed-sensing reconstructions help fill the gap.
              </textarea>
          </section>

          <section data-markdown class="compact" data-background="linear-gradient(#62628480, #99999980)">
              <textarea data-template>
                  ### PhD Research: Compressed sensing for electron tomography

                  - **Application interest**: Recover a signal with far fewer samples than traditionally required.
                    - Faster MRI, dose-limited electron microscopy (EM), computed tomography.
                  - **Research goal**: Characterize the application of CS to ET.
                  - **Results**
                    - Measurement + sparsity analysis: no useful random measurements, bio EM images aren't sparse.
                    - Implementation: new reconstruction algo matches SOTA (SIRT/ART), but doesn't exceed like in materials EM.
              </textarea>
          </section>

          <section data-markdown class="compact" data-background="linear-gradient(#62628480, #99999980)">
              <textarea data-template>
                  ### PhD Research: CS-ET measurement + sparsity analysis

                  - **ET measurement**: Measurement vectors are discretized line integral weights.
                    - CS reconstruction theory requires incoherent measurements. Tilt series measurements exhibit coherence (same $r$, different $\theta$).
                    - No natural randomization strategy to introduce statistical incoherence.

                  - **Signal sparsity**: Bio EM images are not sparse in Euclidean or wavelet domains.
                    - Somewhat compressible in wavelet and "_TV_ domain".

                  - **Signal recovery**: Deterministic measurement matrix = CS recovery is just Lasso regression. $$\hat{u}=\mathrm{argmin}_{x} ||Rx-y||_2^2 + \lambda_1 ||x||_1 + \lambda_2 ||Wx||_1 + \lambda_3 ||TVx||_1$$
              </textarea>
          </section>

                  # Thoughts for Perseus
              </textarea>

          <section data-markdown class="compact" data-background="linear-gradient(#62628480, #99999980)">
            <textarea data-template>
                ### Background questions
                 
                - **Compute**: What *exactly* is the board? TOPS, and NPU vs FPGA vs DSP?
                - **Sensor + optics**: Uncooled LWIR? Resolution, pixel pitch, frame rate, lens f/# and FOV. IMUs?
                - **Engagement geometry**: Handoff range, closing speed, and INS error at handoff.
                - **Lethality**: Required miss distance (establishes how good "good enough" tracking is).
                - **Dynamics**: body rates (especially roll) while in vision mode.
            </textarea>
          </section>

          <section data-markdown class="compact" data-background="linear-gradient(#62628480, #99999980)">
            <textarea data-template>
                ### What CV Is Actually Needed?
                 
                - **Sensor decision first**: This constrains everything else. Assuming uncooled LWIR based on SWaP.
                - **Is unconstrained clutter really in scope?**
                  - CONOP is INS-to-waypoint, terminal vision only.
                  - Engaging from below = target is mostly against sky.
                - **Motivation**: Compute limits present major challenges for appearance-based CV against unconstrained backgrounds.
                  - Problem suggests a _thermal hot-spot seeker_ rather than neural net-based CV.
                  - Maybe combined with a horizon detector.
            </textarea>
          </section>

          <section data-markdown class="compact" data-background="linear-gradient(#62628480, #99999980)">
            <textarea data-template>
                ### Back of Envelope: Pixels on Target.

                - Assume Boson FLIR-style 640x512 @ 12$\mu$m camera, 0.35m target, $10^{\circ}$ or $20^{\circ}$ FOV lens.
                 
                | Range | Wide FOV (20°) | Narrow FOV (10°) |
                |---|---|---|
                | 1000 m | ~0.6 px | ~1.3 px |
                | 500 m | ~1.3 px | ~2.6 px |
                | 200 m | ~3 px | ~6.5 px |
                | 100 m | ~6 px | ~13 px |
                | 50 m | ~13 px | ~26 px |

                - Target only spatially resolved at 100m, for ~0.5s.
            </textarea>
          </section>

          <section data-markdown class="compact" data-background="linear-gradient(#62628480, #99999980)">
            <textarea data-template>
                ### Proposed Terminal Pipeline
 
                - **IR hot-spot seeker**: Find the most anomalous thermal source in the basket, hand to a lightweight tracker.
                - **Track LOS state**: Filter bearing measurements with an EKF to estimate LOS angles + rates for proportional nav.
                - **Ego motion compensation**: Assuming no gimbal, the tracker must tolerate roll and motion blur. **De-rotate with the IMU** (how accurate?)
                - **Maybe a neural net**: decoy/bird discrimination, _if_ it fits the latency budget.
                  - Either applied to target silhouette (limited range) or target trajectory time series (limited data).
            </textarea>
          </section>

          <section data-markdown class="compact" data-background="linear-gradient(#62628480, #99999980)">
            <textarea data-template>
                ### Risks, Data & Test, Failure Modes
 
                - **Data risk**: High-speed, all-condition LWIR video is scarce. 
                  - **Data collection + test ops** are first-class concerns. What are the plans?
                - **Failure modes** to design for now
                  - **Loss-of-lock & re-acquisition**. How do vision and control interact?
                  - **Decoy / bird discrimination**: Where a small classifier or kinematic gating may pay off.
                  - **Sun + thermal saturation**, and the **sky→clutter transition** at pitch-over.
                - **First impressions:** LWIR hot-spot tracking against sky is very achievable. The sky→clutter transition milestone is the primary CV risk. I'd identify the true vision requirements and de-risk this first.
            </textarea>
          </section>

                parallaxBackgroundImage: '', // e.g. "'https://s3.amazonaws.com/hakim-static/reveal-js/reveal-parallax-1.jpg'"

                // Parallax background size
                parallaxBackgroundSize: '', // CSS syntax, e.g. "2100px 900px"

                // Number of pixels to move the parallax background per slide
                // - Calculated automatically unless specified
                // - Set to 0 to disable movement along an axis
                parallaxBackgroundHorizontal: null,
                parallaxBackgroundVertical: null,

                // The display mode that will be used to show slides
                display: 'block'
            });
        </script>

    </body>
